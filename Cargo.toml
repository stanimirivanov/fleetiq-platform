[workspace]
members = ["crates/domain"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/stanimirivanov/fleetiq-platform"
rust-version = "1.98.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
