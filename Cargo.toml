[workspace]
members = [
    "crates/analytics",
    "crates/application",
    "crates/domain",
    "crates/postgres",
    "crates/protocol-host",
    "crates/protocol-sdk",
    "crates/protocol-wasm",
    "crates/semantics",
    "crates/server",
    "crates/telemetry",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/stanimirivanov/fleetiq-platform"
rust-version = "1.98.1"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bigdecimal = { version = "0.4.0", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["bigdecimal", "macros", "migrate", "postgres", "runtime-tokio"] }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "~1.53", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
wasmtime = { version = "48.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
