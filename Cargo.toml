[workspace]
members = [
    "crates/analytics",
    "crates/application",
    "crates/domain",
    "crates/postgres",
    "crates/protocol-host",
    "crates/protocol-sdk",
    "crates/semantics",
    "crates/telemetry",
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/stanimirivanov/fleetiq-platform"
rust-version = "1.98.1"

[workspace.dependencies]
bigdecimal = { version = "0.4.0", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["bigdecimal", "macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "~1.51", default-features = false, features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
