[workspace]
members = [
    "crates/access",
    "crates/analytics",
    "crates/domain",
    "crates/history",
    "crates/identity",
    "crates/ingestion",
    "crates/live",
    "crates/metadata",
    "crates/postgres",
    "crates/projection",
    "crates/protocol-host",
    "crates/protocol-sdk",
    "crates/protocol-wasm",
    "crates/semantics",
    "crates/server",
    "crates/telemetry",
    "crates/xtask",
    "examples/custom-protocol",
    "packages/teltonika",
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/stanimirivanov/fleetiq-platform"
rust-version = "1.99.1"

[workspace.dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
rlimit = { version = "=0.11.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bigdecimal = { version = "0.4.0", default-features = false }
cookie = { version = "0.18.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
url = { version = "2.5.7", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["bigdecimal", "macros", "migrate", "postgres", "runtime-tokio"] }
sha2 = { version = "0.11.0", default-features = false }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls"] }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "~1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
wasmtime = { version = "50.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
