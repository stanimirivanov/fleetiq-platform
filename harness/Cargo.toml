[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/stanimirivanov/fleetiq-platform"
rust-version = "1.100.0"

[workspace.dependencies]
cargo_metadata = { version = "0.23.1", default-features = false }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
syn = { version = "3.0.5", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
