name: fleetiq-platform

services:
  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: ${FLEETIQ_DATABASE_URL:-postgres://fleetiq:fleetiq-local-only@postgres:5432/fleetiq}
      FLEETIQ_BIND_ADDRESS: 0.0.0.0:8080
    ports:
      # Keep the API local and avoid common application ports by default.
      - "127.0.0.1:${FLEETIQ_HTTP_PORT:-58080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  postgres:
    image: postgres:18.6-alpine3.23
    shm_size: 128mb
    environment:
      POSTGRES_DB: fleetiq
      POSTGRES_USER: fleetiq
      POSTGRES_PASSWORD: fleetiq-local-only
    ports:
      # Bind only on the local interface and avoid taking PostgreSQL's default
      # host port. Override this value when 55432 is unavailable.
      - "127.0.0.1:${FLEETIQ_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetiq -d fleetiq"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - fleetiq-postgres-data:/var/lib/postgresql

volumes:
  fleetiq-postgres-data:
