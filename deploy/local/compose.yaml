name: fleetiq-platform

services:
  postgres:
    image: postgres:18.6-alpine3.23
    shm_size: 128mb
    environment:
      POSTGRES_DB: fleetiq
      POSTGRES_USER: fleetiq
      POSTGRES_PASSWORD: fleetiq-local-only
    ports:
      # Bind only on the local interface and avoid taking PostgreSQL's default
      # host port. Override this value when 55432 is unavailable.
      - "127.0.0.1:${FLEETIQ_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetiq -d fleetiq"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - fleetiq-postgres-data:/var/lib/postgresql

volumes:
  fleetiq-postgres-data:
