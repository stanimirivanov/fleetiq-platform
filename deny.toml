# Supply-chain policy for the complete locked Cargo workspace. Keep exceptions
# narrow and explain them at the dependency that requires one.

[advisories]
# The RustSec database is fetched on each check. A newly disclosed vulnerability
# must fail CI; no advisories are ignored by default.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[bans]
# Transitive version duplication is reported for review. Denying every duplicate
# would make unrelated upstream resolution changes block the project.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[bans.workspace-dependencies]
duplicates = "deny"
# Local capability paths remain explicit so the architecture checker can inspect
# their edges; centralize only third-party dependency declarations.
include-path-dependencies = false
unused = "deny"

[licenses]
# Include fixture and build tooling: both execute in developer and CI contexts.
include-dev = true
include-build = true
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# The test-only OpenAPI example validator (jsonschema 0.57) reaches
# borrow-or-share through referencing and fluent-uri. MIT-0 is permissive,
# but is not a workspace-wide license choice. Keep this exception exact.
# Owner: HTTP contract maintainers. Remove when the validator no longer needs
# this crate or a suitable schema validator avoids it.
exceptions = [
    { crate = "borrow-or-share@0.2.4", allow = ["MIT-0"] },
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
