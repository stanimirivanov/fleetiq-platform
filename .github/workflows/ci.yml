name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://fleetiq:fleetiq-ci@localhost:5432/fleetiq
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: fleetiq
          POSTGRES_USER: fleetiq
          POSTGRES_PASSWORD: fleetiq-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetiq -d fleetiq"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Apply metadata schema for checked queries
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file migrations/0001_metadata_foundation.sql

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Check documentation
        run: cargo doc --workspace --no-deps --locked
