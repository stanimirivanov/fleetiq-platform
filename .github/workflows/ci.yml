# Generated from .github/ci.yml.template and the Rust verification catalogue.
# Action major-version tags live in .github/workflows/ci.yml; structure/tools come from this template/catalogue.
# Edit structure via the template and cargo xtask verify --write-ci; update action tags in the workflow.
name: CI
run-name: FleetIQ PR ${{ github.event.pull_request.number }} from ${{ github.event.pull_request.head.sha }} to ${{ github.event.pull_request.base.ref }} at ${{ github.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  architecture:
    name: Architecture policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Use the exact PR event base, never HEAD^ from the synthetic merge.
      # A missing trusted base must fail history verification.
      HARNESS_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify CI policy before installing harness tools
        run: cargo xtask verify --check-ci

      - name: Verify repository policy before auxiliary setup
        run: cargo xtask repository

      - name: Verify workspace architecture before auxiliary setup
        run: cargo xtask architecture

      - name: Install Node.js for the checksummed scanner installer
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Gitleaks with SHA-256 verification
        run: node scripts/install-gitleaks.mjs

      - name: Run authoritative architecture verification
        id: verify
        run: cargo xtask verify --group architecture --base "$HARNESS_BASE"

      - name: Publish architecture verification evidence
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harness-architecture
          path: target/verification/*.json
          if-no-files-found: error
          retention-days: 14

  harness-windows:
    name: Windows harness sensors
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install locked OpenAPI tools
        run: pnpm install --frozen-lockfile

      - name: Verify repository routing and documentation
        run: cargo xtask repository

      - name: Verify workspace architecture
        run: cargo xtask architecture

      - name: Exercise Windows repository sensor fixtures
        run: cargo test -p fleetiq-xtask --locked

      - name: Exercise cross-platform producer fixtures
        run: node --test scripts/images/tests/*.test.mjs

      - name: Run authoritative OpenAPI verification on Windows
        id: verify
        run: cargo xtask verify --group openapi

      - name: Publish Windows OpenAPI verification evidence
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harness-windows-openapi
          path: target/verification/*.json
          if-no-files-found: error
          retention-days: 14

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install locked OpenAPI tools
        run: pnpm install --frozen-lockfile

      - name: Run authoritative OpenAPI verification
        id: verify
        run: cargo xtask verify --group openapi

      - name: Publish OpenAPI verification evidence
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harness-openapi
          path: target/verification/*.json
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned dependency tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked

      - name: Run authoritative supply-chain verification
        id: verify
        run: cargo xtask verify --group supply-chain

      - name: Publish supply-chain verification evidence
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harness-supply-chain
          path: target/verification/*.json
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust quality gate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://fleetiq:fleetiq-ci@localhost:5432/fleetiq

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: fleetiq
          POSTGRES_USER: fleetiq
          POSTGRES_PASSWORD: fleetiq-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetiq -d fleetiq"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Restore reviewed Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fleetiq-rust-v1
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.config/nextest.toml') }}
          env-vars: RUSTFLAGS RUSTDOCFLAGS CARGO_BUILD_TARGET
          cache-targets: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
          checksum: true
          fallback: none

      - name: Install pinned SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.9.0 --locked --debug
          --no-default-features --features rustls,postgres

      - name: Apply metadata schema for checked queries
        run: sqlx migrate run --source migrations

      - name: Run authoritative Rust verification
        id: verify
        run: cargo xtask verify --group rust

      - name: Publish Rust verification evidence
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harness-rust
          path: |
            target/verification/*.json
            target/ingestion-measurements/*.json
          if-no-files-found: error
          retention-days: 14

  local-compose:
    name: Local Compose smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js for artifact qualification
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify producer policy and negative fixtures
        run: node --test scripts/images/tests/*.test.mjs

      - name: Qualify production bytes and development Compose
        id: qualify
        run: node scripts/images/qualify.mjs

      - name: Retain image qualification and failure evidence
        if: always() && steps.qualify.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-qualification
          path: target/images/*/reports/*.json
          if-no-files-found: error
          retention-days: 14
