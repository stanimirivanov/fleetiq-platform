plugins:
  - ../../scripts/openapi/redocly-plugin.mjs

# Singular examples are literal payloads; named Example Object references resolve.
resolve:
  doNotResolveExamples: true

extends:
  - minimal

rules:
  no-unresolved-refs: error
  no-ambiguous-paths: error
  operation-operationId: error
  operation-parameters-unique: error
  fleetiq/layout: error
