description: "Immutable properties version summaries ordered by (id, numeric version). Missing identities return an empty terminal page. Complete content is obtained through the existing exact GET."
headers:
  Cache-Control:
    $ref: "../headers/cache-control.yaml"
content:
  "application/json":
    schema:
      $ref: "../schemas/DefinitionCataloguePage.yaml"
    example:
      definitions:
        - id: "temperature"
          version: 1
          name: "Temperature"
        - id: "temperature"
          version: 2
          name: "Temperature"
        - id: "temperature"
          version: 10
          name: "Temperature"
      next_after: null
