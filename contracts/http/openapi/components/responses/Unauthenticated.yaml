description: "The selected authentication mode rejected missing, invalid, expired, or unregistered credentials. WWW-Authenticate is emitted only for configured workload bearer mode."
headers:
  Cache-Control:
    $ref: "../headers/cache-control.yaml"
  WWW-Authenticate:
    schema:
      type: "string"
      const: "Bearer realm=\"FleetIQ\""
content:
  "application/problem+json":
    schema:
      $ref: "../schemas/Problem.yaml"
    example:
      type: "urn:fleetiq:problem:unauthorized"
      title: "Authentication required"
      status: 401
