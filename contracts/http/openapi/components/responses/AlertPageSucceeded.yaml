description: Bounded observed alerts in C-collated rule/revision order; no snapshot guarantee.
headers:
  Cache-Control:
    $ref: ../headers/cache-control.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/AlertPage.yaml
    example:
      alerts:
      - rule_id: voltage-high
        rule_revision: 1
        scope_asset_id: asset-a
        target_asset_id: result
        version: '2'
        phase: firing
        selected: true
        candidate_since_ms: null
        last_event_at_ms: '2000'
        latest_transition:
          version: '2'
          phase: firing
          event_at_ms: '2000'
          recorded_at_ms: '2010'
          activation_generation: 1
          evidence:
            evaluation_id: evaluation-b
            scope_asset_id: asset-a
            output_index: 0
      next_after: null
