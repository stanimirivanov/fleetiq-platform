description: Configured tenant history-work slots or reserved response bytes are exhausted, or output exceeded its reserved allowance. Retry after competing work completes or expires; the requested allowance may require policy review. No evidence or empty page is implied.
headers:
  Cache-Control:
    $ref: ../headers/cache-control.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
    example:
      type: urn:fleetiq:problem:history-budget-exceeded
      title: History work budget exceeded
      status: 429
