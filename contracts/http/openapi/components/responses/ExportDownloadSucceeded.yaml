description: Verified complete property-history-v1 Parquet attachment. No public URL, redirects or storage
  credentials. Bounded delivery may terminate on expiry/deadline; a partial transfer is never a complete
  artifact.
headers:
  Cache-Control:
    $ref: ../headers/cache-control.yaml
  Content-Disposition:
    description: Generated numeric identity only; no caller filename or path.
    schema:
      type: string
      pattern: ^attachment; filename="fleetiq-export-[1-9][0-9]*[.]parquet"$
  Content-Length:
    description: Verified complete bytes, at most 2 MiB.
    schema:
      type: integer
      minimum: 1
      maximum: 2097152
  Accept-Ranges:
    schema:
      type: string
      const: none
  X-Content-Type-Options:
    schema:
      type: string
      const: nosniff
content:
  application/vnd.apache.parquet:
    schema:
      type: string
      format: binary
      maxLength: 2097152
