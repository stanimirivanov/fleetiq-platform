    schema:
      type: string
      pattern: ^bytes [*]/[1-9][0-9]*$
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
    example:
      type: urn:fleetiq:problem:historical-export
      title: Export byte ranges are unsupported
      status: 416
