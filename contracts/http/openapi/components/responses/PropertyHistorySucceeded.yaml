description: Bounded hot-history interpretations. Empty is no matching durable interpretation, not proof
  of a known asset/property or healthy ingestion.
headers:
  Cache-Control:
    $ref: ../headers/cache-control.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/PropertyHistoryPage.yaml
    example:
      changes:
      - interpretation: v1.
        tenant_id: tenant-a
        asset_id: asset-a
        property_id: electrical.voltage
        property_version: 1
        binding_id: binding-1
        binding_revision: '1'
        event_time_basis: device_recorded
        event_at_ms: '1000'
        first_resolution_effective_at_ms: '1000'
        first_resolution_known_at_ms: '150'
        value:
          kind: integer
          value: '9223372036854775807'
        source_unit: volt
        quality: good
        source:
          message_id: message-1
          protocol_package_id: vendor.protocol
          protocol_package_version: '1'
          output_index: 0
          device_asset_id: gateway-1
          endpoint_id: can-primary
          signal_id: bus.voltage
          device_recorded_at_ms: '1000'
          received_at_ms: '2000'
      next_after: null
