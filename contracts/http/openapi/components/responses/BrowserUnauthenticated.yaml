    $ref: "../headers/cache-control.yaml"
  Referrer-Policy:
    $ref: "../headers/referrer-policy.yaml"
content:
  "application/problem+json":
    schema:
      $ref: "../schemas/Problem.yaml"
    example:
      type: "urn:fleetiq:problem:unauthorized"
      title: "Authentication required"
      status: 401
