description: One tenant-owned bounded semantic graph at a consistent database snapshot. Check truncated
  and reasons; no pagination/continuity promise across requests.
headers:
  Cache-Control:
    $ref: ../headers/cache-control.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/SemanticGraph.yaml
    example:
      root_asset_id: asset-a
      effective_at_ms: 50
      known_at_ms: 50
      budget:
        depth: 2
        assets: 50
        relationships: 100
        bindings: 100
      assets:
      - id: asset-a
        tenant_id: tenant-a
        name: Asset A
        asset_type:
          id: equipment
          version: 1
      - id: asset-b
        tenant_id: tenant-a
        name: Asset B
        asset_type:
          id: equipment
          version: 1
      - id: asset-c
        tenant_id: tenant-a
        name: Asset C
        asset_type:
          id: equipment
          version: 1
      - id: gateway-1
        tenant_id: tenant-a
        name: Gateway 1
        asset_type:
          id: equipment
          version: 1
      relationships:
      - id: ab
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        relationship_type:
          id: connected
          version: 1
        source_asset_id: asset-a
        target_asset_id: asset-b
        effective_interval:
          start_ms: 0
          end_ms: 100
      - id: bc
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        relationship_type:
          id: connected
          version: 1
        source_asset_id: asset-b
        target_asset_id: asset-c
        effective_interval:
          start_ms: 0
          end_ms: null
      - id: ca
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        relationship_type:
          id: connected
          version: 1
        source_asset_id: asset-c
        target_asset_id: asset-a
        effective_interval:
          start_ms: 0
          end_ms: null
      - id: self
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        relationship_type:
          id: connected
          version: 1
        source_asset_id: asset-a
        target_asset_id: asset-a
        effective_interval:
          start_ms: 0
          end_ms: null
      bindings:
      - id: bind-1
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        source:
          device_asset_id: gateway-1
          endpoint_id: can
          signal_id: bus.voltage
        target:
          asset_id: asset-a
          property:
            id: voltage
            version: 1
        effective_interval:
          start_ms: 0
          end_ms: 100
      - id: bind-self
        tenant_id: tenant-a
        revision: '1'
        recorded_at_ms: 10
        source:
          device_asset_id: gateway-1
          endpoint_id: can
          signal_id: self.voltage
        target:
          asset_id: gateway-1
          property:
            id: voltage
            version: 1
        effective_interval:
          start_ms: 0
          end_ms: null
      truncated: false
      truncation: []
