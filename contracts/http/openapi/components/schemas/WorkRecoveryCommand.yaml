type: object
additionalProperties: false
required:
- operation
- expected_generation
- target
properties:
  operation:
    type: string
    enum:
    - retry
    - pause
    - resume
  expected_generation:
    $ref: ./WorkGeneration.yaml
  target:
    oneOf:
    - $ref: ./WorkRetryTarget.yaml
    - type: object
      maxProperties: 0
allOf:
- if:
    properties:
      operation:
        const: retry
  then:
    properties:
      target:
        $ref: ./WorkRetryTarget.yaml
  else:
    properties:
      target:
        type: object
        maxProperties: 0
