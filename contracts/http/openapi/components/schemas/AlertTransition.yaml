type: object
additionalProperties: false
required:
- version
- phase
- event_at_ms
- recorded_at_ms
- activation_generation
- evidence
properties:
  version:
    $ref: ./AlertLifecycleVersion.yaml
  phase:
    $ref: ./AlertPhase.yaml
  event_at_ms:
    $ref: ./HistoryMillis.yaml
  recorded_at_ms:
    $ref: ./HistoryMillis.yaml
  activation_generation:
    type: integer
    minimum: 1
    maximum: 4294967295
  evidence:
    $ref: ./AlertEvaluationRef.yaml
  acknowledgement:
    anyOf:
    - $ref: ./AlertAcknowledgement.yaml
    - type: 'null'
    description: Independent optional operator annotation for this exact version. May arrive after a page
      was read; original phase/evidence remain immutable.
