description: Integer and decimal values are strings to preserve precision in browser clients. Decimal
  exponents are permitted. No unit conversion is performed.
oneOf:
- type: object
  additionalProperties: false
  required:
  - kind
  - value
  properties:
    kind:
      const: boolean
      type: string
    value:
      type: boolean
- type: object
  additionalProperties: false
  required:
  - kind
  - value
  properties:
    kind:
      const: integer
      type: string
    value:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
      maxLength: 20
- type: object
  additionalProperties: false
  required:
  - kind
  - value
  properties:
    kind:
      const: decimal
      type: string
    value:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?$
- type: object
  additionalProperties: false
  required:
  - kind
  - value
  properties:
    kind:
      const: text
      type: string
    value:
      type: string
