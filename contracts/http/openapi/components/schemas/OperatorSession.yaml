type: "object"
additionalProperties: false
required:
  - "actor_id"
  - "expires_at_ms"
properties:
  actor_id:
    type: "string"
    minLength: 1
    description: "Internal actor established at sign-in, with its current identity mapping revalidated."
  expires_at_ms:
    type: "integer"
    format: "int64"
    minimum: 1
    description: "Absolute expiry in Unix epoch milliseconds; no sliding renewal."
