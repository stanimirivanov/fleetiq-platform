type: "object"
additionalProperties: false
required:
  - "authority_id"
  - "subject"
properties:
  authority_id:
    $ref: "./AdministrationIdentifier.yaml"
  subject:
    type: "string"
    minLength: 1
    maxLength: 512
    pattern: "^(?=[\\s\\S]*\\S)[^\\u0000-\\u001F\\u007F-\\u009F]+$"
    description: "Exact case-sensitive opaque subject; never trimmed or normalized. Not a credential."
