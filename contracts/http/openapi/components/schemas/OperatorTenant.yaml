type: "object"
additionalProperties: false
required:
  - "tenant_id"
  - "actions"
properties:
  tenant_id:
    type: "string"
    minLength: 1
    maxLength: 128
  actions:
    type: "array"
    minItems: 1
    maxItems: 3
    uniqueItems: true
    description: "Explicit current grants ordered by action name; never reusable authorization."
    items:
      $ref: "./TenantAction.yaml"
