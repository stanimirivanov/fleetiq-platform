type: object
additionalProperties: false
required: [grants, next_after]
properties:
  grants:
    type: array
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: ./PlatformAction.yaml
  next_after:
    anyOf:
      - $ref: ./PlatformAction.yaml
      - type: "null"
