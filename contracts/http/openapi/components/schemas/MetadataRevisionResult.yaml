type: "object"
additionalProperties: false
required:
  -
    "outcome"
  -
    "id"
  -
    "revision"
  -
    "recorded_by"
  -
    "recorded_at_ms"
properties:
  outcome:
    type: "string"
    enum:
      -
        "appended"
      -
        "already_appended"
  id:
    type: "string"
    minLength: 1
    maxLength: 128
    pattern: "^[^\\s]+$"
  revision:
    type: "string"
    pattern: "^[1-9][0-9]*$"
    maxLength: 20
    description: "Canonical positive u64 decimal text."
  recorded_by:
    type: "string"
    minLength: 1
    maxLength: 128
    pattern: "^[^\\s]+$"
  recorded_at_ms:
    type: "integer"
    format: "int64"
