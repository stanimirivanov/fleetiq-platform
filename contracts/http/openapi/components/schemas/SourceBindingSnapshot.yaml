type: "object"
required:
  - "source"
  - "effective_at_ms"
  - "known_at_ms"
  - "bindings"
  - "next_after"
properties:
  source:
    $ref: "./SignalSource.yaml"
  effective_at_ms:
    type: "integer"
    format: "int64"
    description: "Physical time used for this page."
  known_at_ms:
    type: "integer"
    format: "int64"
    description: "Recorded-time cutoff used for this page."
  bindings:
    type: "array"
    maxItems: 100
    items:
      $ref: "./SignalBinding.yaml"
  next_after:
    type:
      - "string"
      - "null"
    minLength: 1
    maxLength: 128
    description: "Exclusive stable binding-ID cursor; null ends traversal."
description: "One bounded, bitemporal signal-binding page for an exact source signal."
