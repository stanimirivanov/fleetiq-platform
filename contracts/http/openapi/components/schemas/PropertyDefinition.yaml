type: "object"
required:
  - "id"
  - "version"
  - "name"
  - "value_kind"
  - "canonical_unit"
properties:
  id:
    type: "string"
    minLength: 1
    maxLength: 128
    description: "Immutable property definition ID."
  version:
    type: "integer"
    minimum: 1
    maximum: 4294967295
  name:
    type: "string"
    minLength: 1
  value_kind:
    type: "string"
    enum:
      - "boolean"
      - "integer"
      - "decimal"
      - "text"
  canonical_unit:
    type:
      - "string"
      - "null"
    minLength: 1
    description: "Canonical configured unit, or null if this property is unitless."
