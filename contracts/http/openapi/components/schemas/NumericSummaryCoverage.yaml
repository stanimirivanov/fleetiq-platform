type: object
additionalProperties: false
required:
- scope
- manifest_id
- restore_generation
properties:
  scope:
    type: string
    enum: [hot_snapshot, hot_and_selected_manifest_snapshot]
  manifest_id:
    type: [string, 'null']
    pattern: '^[1-9][0-9]*$'
    maxLength: 19
  restore_generation:
    type: [string, 'null']
    pattern: '^[1-9][0-9]*$'
    maxLength: 19
