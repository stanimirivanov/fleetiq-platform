type: "object"
required:
  - "id"
  - "version"
  - "name"
  - "supported_properties"
properties:
  id:
    type: "string"
    minLength: 1
    maxLength: 128
    description: "Immutable asset-type definition ID."
  version:
    type: "integer"
    minimum: 1
    maximum: 4294967295
  name:
    type: "string"
    minLength: 1
  supported_properties:
    type: "array"
    items:
      $ref: "./PropertyReference.yaml"
    description: "Ordered exact property-definition references."
