type: object
additionalProperties: false
required:
- changes
- next_after
properties:
  changes:
    type: array
    maxItems: 100
    items:
      $ref: ./PropertyHistoryChange.yaml
  next_after:
    oneOf:
    - $ref: ./HistoryToken.yaml
    - type: 'null'
  coverage:
    $ref: ./PropertyHistoryCoverage.yaml
  restored_row_indices:
    type: array
    maxItems: 16
    uniqueItems: true
    description: Sorted zero-based indices into this page's changes that belong to the verified
      selected restore. Present only when requested. Empty when no displayed row belongs to a
      verified selection. A row present in both stores is included once.
    items:
      type: integer
      minimum: 0
      maximum: 99
