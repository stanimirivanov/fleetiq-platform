type: object
additionalProperties: false
required:
- evaluation_id
- scope_asset_id
- output_index
properties:
  evaluation_id:
    $ref: ./AdministrationIdentifier.yaml
  scope_asset_id:
    $ref: ./AdministrationIdentifier.yaml
  output_index:
    anyOf:
    - type: integer
      minimum: 0
      maximum: 1023
    - type: 'null'
description: Exact reference into the existing tenant/scope calculator evaluation and output reads. Those
  require separate telemetry.read. Null output_index means the transition consumed unknown evidence without
  a usable output slot; it does not mean the condition was false.
