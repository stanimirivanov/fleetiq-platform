type: object
additionalProperties: false
required:
- generation
- revision
- pending
- evaluated_at_ms
- stale_after_ms
- mapping
- mapping_supported
- summary
- assets
- next_after
properties:
  generation:
    $ref: ./ProjectionCounter.yaml
  revision:
    $ref: ./ProjectionCounter.yaml
  pending:
    type: boolean
  evaluated_at_ms:
    $ref: ./HistoryMillis.yaml
  stale_after_ms:
    type: integer
    const: 30000
  mapping:
    $ref: ./FleetLocationMapping.yaml
  mapping_supported:
    type: boolean
  summary:
    $ref: ./FleetSummary.yaml
  assets:
    type: array
    maxItems: 100
    items:
      $ref: ./FleetAsset.yaml
  next_after:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 128
