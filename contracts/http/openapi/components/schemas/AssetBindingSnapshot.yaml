type: "object"
required:
  - "asset_id"
  - "effective_at_ms"
  - "known_at_ms"
  - "bindings"
  - "next_after"
properties:
  asset_id:
    type: "string"
    minLength: 1
    maxLength: 128
    description: "Queried target asset in the current catalogue."
  effective_at_ms:
    type: "integer"
    format: "int64"
    description: "Physical time used for this page."
  known_at_ms:
    type: "integer"
    format: "int64"
    description: "Recorded-time cutoff used for this page."
  bindings:
    type: "array"
    maxItems: 100
    items:
      $ref: "./SignalBinding.yaml"
  next_after:
    type:
      - "string"
      - "null"
    minLength: 1
    maxLength: 128
    description: "Exclusive stable binding-ID cursor; null ends traversal."
description: "One bounded, bitemporal signal-binding page targeting an asset."
