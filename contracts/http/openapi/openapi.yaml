openapi: "3.1.1"
info:
  title: "FleetIQ HTTP UI baseline"
  version: "1.0.0-baseline.3"
  description: "Backend-owned, versioned subset of the /api/v1 HTTP surface for asset identity and semantic metadata reads. Other implemented routes are intentionally not yet described here. Protected routes use configured workload bearer or provider-neutral OIDC browser sessions. Modes are mutually exclusive; every read checks current identity and tenant metadata.read policy."
servers:
  - url: "/"
security: []
paths:
  "/api/v1":
    $ref: "./paths/system/version.yaml"
  "/api/v1/tenants/{tenant_id}/assets":
    $ref: "./paths/assets/catalogue.yaml"
  "/api/v1/tenants/{tenant_id}/assets/{asset_id}":
    $ref: "./paths/assets/detail.yaml"
  "/api/v1/tenants/{tenant_id}/assets/{asset_id}/relationships":
    $ref: "./paths/assets/relationships.yaml"
  "/api/v1/tenants/{tenant_id}/assets/{asset_id}/signal-bindings":
    $ref: "./paths/assets/signal-bindings.yaml"
  "/api/v1/tenants/{tenant_id}/signal-bindings":
    $ref: "./paths/bindings/source.yaml"
  "/api/v1/tenants/{tenant_id}/asset-types/{type_id}/versions/{version}":
    $ref: "./paths/definitions/asset-type.yaml"
  "/api/v1/tenants/{tenant_id}/properties/{property_id}/versions/{version}":
    $ref: "./paths/definitions/property.yaml"
  "/api/v1/tenants/{tenant_id}/relationship-types/{type_id}/versions/{version}":
    $ref: "./paths/definitions/relationship-type.yaml"
  "/api/v1/auth/login":
    $ref: "./paths/identity/login.yaml"
  "/api/v1/auth/callback":
    $ref: "./paths/identity/callback.yaml"
  "/api/v1/auth/session":
    $ref: "./paths/identity/session.yaml"
  "/api/v1/auth/logout":
    $ref: "./paths/identity/logout.yaml"
