    RelationshipTypeRef:
      $ref: "./components/schemas/RelationshipTypeRef.yaml"
    PropertyReference:
      $ref: "./components/schemas/PropertyReference.yaml"
    EffectiveInterval:
      $ref: "./components/schemas/EffectiveInterval.yaml"
    Relationship:
      $ref: "./components/schemas/Relationship.yaml"
    RelationshipSnapshot:
