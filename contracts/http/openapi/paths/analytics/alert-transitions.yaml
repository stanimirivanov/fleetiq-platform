get:
  operationId: listAlertTransitions
  summary: Read bounded alert transition history
  description: Requires exact current alerts.read before discovery. Metadata, telemetry, analytics and
    alerts.manage grants imply no access. Transitions retain original event/receipt times, activation
    generation and exact evidence identity. Pages advance by positive lifecycle version. A missing/foreign/unobserved
    alert returns 404; an exhausted page is empty. Cursors from another resource or revision are invalid.
    All evidence references target existing calculator reads that retain separate telemetry.read authority;
    no raw output or input payload is expanded.
  security:
  - bearerAuth: []
  - cookieAuth: []
  parameters:
  - $ref: ../../components/parameters/admin-tenant-id.yaml
  - $ref: ../../components/parameters/alert-rule-id.yaml
  - $ref: ../../components/parameters/alert-identity-revision.yaml
  - $ref: ../../components/parameters/alert-page-limit.yaml
  - $ref: ../../components/parameters/alert-read-after.yaml
  responses:
    '200':
      $ref: ../../components/responses/AlertTransitionPageSucceeded.yaml
    '400':
      $ref: ../../components/responses/InvalidRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '405':
      $ref: ../../components/responses/CalculatorEvidenceMethodNotAllowed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
