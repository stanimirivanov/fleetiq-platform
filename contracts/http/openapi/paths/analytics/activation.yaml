get:
  operationId: getCalculatorActivation
  summary: getCalculatorActivation
  description: Requires current metadata.read before resource discovery. Inactive by default. Selection
    serializes with enumeration and claims; deactivation pauses unclaimed work, while already issued claims
    may complete with original evidence. A stale exact retry returns its original receipt without restoring
    selection.
  security:
  - bearerAuth: []
  - cookieAuth: []
  parameters:
  - &id001
    $ref: ../../components/parameters/admin-tenant-id.yaml
  - &id002
    $ref: ../../components/parameters/calculator-configuration-id.yaml
  responses:
    '200':
      $ref: ../../components/responses/CalculatorActivationSucceeded.yaml
    '400':
      $ref: ../../components/responses/InvalidRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '405':
      $ref: ../../components/responses/CalculatorConfigurationMethodNotAllowed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
put:
  operationId: changeCalculatorActivation
  summary: changeCalculatorActivation
  description: Requires exact analytics.manage, never implied by metadata/protocol grants. Browser mutations
    require matching Origin and X-FleetIQ-CSRF. Transactionally rechecks current actor, tenant and grant.
    Inactive by default. Selection serializes with enumeration and claims; deactivation pauses unclaimed
    work, while already issued claims may complete with original evidence. A stale exact retry returns
    its original receipt without restoring selection.
  security:
  - bearerAuth: []
  - cookieAuth: []
  parameters:
  - *id001
  - *id002
  - $ref: ../../components/parameters/admin-mutation-origin.yaml
  - $ref: ../../components/parameters/admin-mutation-csrf.yaml
  responses:
    '200':
      $ref: ../../components/responses/CalculatorActivationSucceeded.yaml
    '400':
      $ref: ../../components/responses/InvalidRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '405':
      $ref: ../../components/responses/CalculatorConfigurationMethodNotAllowed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '409':
      $ref: ../../components/responses/CalculatorConfigurationConflict.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CalculatorActivationRequest.yaml
        example:
          expected_generation: 0
          revision: 1
