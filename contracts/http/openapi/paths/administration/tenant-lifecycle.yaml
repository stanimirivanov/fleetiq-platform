post:
  operationId: "changeTenantLifecycle"
  summary: "Activate or suspend an existing tenant"
  description: "Requires fresh authenticated actor and exact current platform tenant.lifecycle.manage evidence. Tenant grants or other platform actions do not substitute. Available only on an authenticated listener. All outcomes are no-store with redacted problems. Browser mode additionally requires one exact configured Origin and X-FleetIQ-CSRF: 1; bearer credentials cannot bypass session mode. JSON is bounded to 16 KiB and rejects unknown fields. The client supplies a stable opaque command ID; keep it and all business fields unchanged after an uncertain response. The server derives the administrator and receipt time. Exact retries keep the first committed time and original effect; different content or actor using that ID conflicts. Current authentication and authority are rechecked even on retry. Retains tenant data, grants, and history. Suspension denies fresh tenant authorization and removes the tenant from operator discovery. It does not cancel in-flight work or suspend ingestion/workers. Platform administration remains available for activation. An already-requested state records a no-change audit. Replaying a command after another state transition returns the original effect without undoing the later transition."
  security:
    -
      bearerAuth: []
    -
      cookieAuth: []
  parameters:
    -
      $ref: "../../components/parameters/admin-tenant-id.yaml"
    -
      $ref: "../../components/parameters/admin-mutation-origin.yaml"
    -
      $ref: "../../components/parameters/admin-mutation-csrf.yaml"
  requestBody:
    required: true
    content:
      "application/json":
        schema:
          $ref: "../../components/schemas/TenantLifecycleRequest.yaml"
  responses:
    "200":
      $ref: "../../components/responses/changeTenantLifecycle-200.yaml"
    "400":
      $ref: "../../components/responses/InvalidRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthenticated.yaml"
    "403":
      $ref: "../../components/responses/TenantAdministrationForbidden.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "405":
      $ref: "../../components/responses/TenantLifecycleMethodNotAllowed.yaml"
    "409":
      $ref: "../../components/responses/TenantAdministrationConflict.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
