get:
  operationId: listExternalIdentityChanges
  summary: "Page immutable external-identity change evidence"
  description: "Requires fresh authentication and exact current platform identity.manage authority. Tenant grants and other platform actions never substitute. Only mounted on an authenticated listener. Every outcome is no-store; problems redact subjects, credentials, and database details. Authentication and authorization precede input validation. Unknown and duplicate query fields are rejected. Platform-wide history in descending (recorded_at_ms, change_id) order, limit 1..100, default 50. Both before_recorded_at_ms and before_change_id are required together. A cursor is not a snapshot. Exact opaque subjects are returned only to the authorized administrator; do not log responses. History does not reconstruct all current mappings because initial bootstrap/provisioning identities have separate evidence."
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - $ref: ../../components/parameters/admin-page-limit.yaml
    - $ref: ../../components/parameters/admin-audit-before-time.yaml
    - $ref: ../../components/parameters/admin-audit-before-change.yaml
  responses:
    "200":
      $ref: ../../components/responses/listExternalIdentityChanges-200.yaml
    "400":
      $ref: ../../components/responses/InvalidRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthenticated.yaml
    "403":
      $ref: ../../components/responses/AdministrationForbidden.yaml
    "405":
      $ref: ../../components/responses/ActorAuditMethodNotAllowed.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
