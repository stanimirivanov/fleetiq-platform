post:
  operationId: changePlatformAccess
  summary: "Grant or revoke one exact platform action"
  description: "Requires fresh authentication and exact current platform platform.access.manage authority. Tenant grants and other platform actions never substitute. Only mounted on an authenticated listener. Every outcome is no-store; problems redact credentials and database details. Authentication and authorization precede input validation. Browser mutations require one exact configured Origin and X-FleetIQ-CSRF: 1; Authorization cannot bypass browser mode. JSON is limited to 16 KiB and rejects unknown fields. The server derives administrator and receipt time; clients retain command ID, target, action and kind after uncertain results. Retries preserve first committed time and effect without restoring earlier grant state. Different content or administrator under the same ID returns 409. Grant/revoke ensures presence/absence; a new already-satisfied command records state_changed false. Missing mutation targets return 404. Removing the final active platform-access administrator conflicts, including when another grant belongs only to an inactive actor. Self-revocation affects the next decision, so retry may return 403: another authorized administrator must inspect audit. Previously issued evidence is not recalled."
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - $ref: ../../components/parameters/admin-actor-id.yaml
    - $ref: ../../components/parameters/admin-mutation-origin.yaml
    - $ref: ../../components/parameters/admin-mutation-csrf.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/PlatformAccessChangeRequest.yaml
  responses:
    "200":
      $ref: ../../components/responses/changePlatformAccess-200.yaml
    "400":
      $ref: ../../components/responses/InvalidRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthenticated.yaml
    "403":
      $ref: ../../components/responses/AdministrationForbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "405":
      $ref: ../../components/responses/ActorLifecycleMethodNotAllowed.yaml
    "409":
      $ref: ../../components/responses/PlatformAccessConflict.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
