get:
  operationId: listActorTenantGrants
  summary: "Page one actor's current tenant grants"
  description: "Requires fresh authentication and exact current tenant access.manage authority. Other tenant actions, grants in another tenant and all platform actions never substitute. Suspended tenants deny access. Only mounted on an authenticated listener. Every outcome is no-store; problems redact credentials and database details. Authentication and tenant authorization precede validation of actor, command and query input. A tenant that cannot be authorized returns 403. Unknown and duplicate query fields are rejected. Ascending exact action-name order, limit 1..100, default 50. Supply after_action from next_after or omit it. Cursors are traversal positions, not authorization or snapshots; revoked cursor grants need not still exist. Missing actors and actors without grants both return an empty terminal page. Inactive target actors retain grants but cannot use them."
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - $ref: ../../components/parameters/admin-tenant-id.yaml
    - $ref: ../../components/parameters/admin-actor-id.yaml
    - $ref: ../../components/parameters/admin-page-limit.yaml
    - $ref: ../../components/parameters/admin-tenant-after-action.yaml
  responses:
    "200":
      $ref: ../../components/responses/listActorTenantGrants-200.yaml
    "400":
      $ref: ../../components/responses/InvalidRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthenticated.yaml
    "403":
      $ref: ../../components/responses/TenantAccessForbidden.yaml
    "405":
      $ref: ../../components/responses/ActorAuditMethodNotAllowed.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
