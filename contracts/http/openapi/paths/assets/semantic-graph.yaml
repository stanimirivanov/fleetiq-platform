get:
  operationId: exploreSemanticGraph
  summary: Explore a bounded semantic asset graph
  description: Requires current metadata.read. Expands both directions of typed relationships and signal
    bindings breadth-first; directed source/target meaning is preserved. Relationships are considered
    before bindings per layer, with bytewise identity ordering. Root depth is zero. Latest known revisions
    are selected before effective-time and endpoint filters, using one repeatable-read snapshot. Included
    links reference only included assets. Explicit depth/asset/link budgets can omit data; inspect truncation
    rather than inferring full graph or sensor inventory. Per-statement timeouts and an eight-second graph-operation
    deadline fail safely rather than returning a misleading partial success.
  security:
  - bearerAuth: []
  - cookieAuth: []
  parameters:
  - $ref: ../../components/parameters/metadata-read-tenant-id.yaml
  - $ref: ../../components/parameters/relationship-asset-id.yaml
  - $ref: ../../components/parameters/effective-at-ms.yaml
  - $ref: ../../components/parameters/known-at-ms.yaml
  - $ref: ../../components/parameters/graph-depth.yaml
  - $ref: ../../components/parameters/graph-asset-limit.yaml
  - $ref: ../../components/parameters/graph-relationship-limit.yaml
  - $ref: ../../components/parameters/graph-binding-limit.yaml
  responses:
    '200':
      $ref: ../../components/responses/SemanticGraphSucceeded.yaml
    '400':
      $ref: ../../components/responses/InvalidRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
