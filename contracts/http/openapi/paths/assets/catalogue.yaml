get:
  operationId: "listAssets"
  summary: "List one authorized tenant's assets in stable ID order"
  description: "The authenticated operator or configured workload identity must have current metadata.read access for the selected tenant. The route is absent without complete browser or workload identity configuration. A cursor traversal is not a cross-request snapshot."
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - $ref: "../../components/parameters/catalogue-tenant-id.yaml"
    - $ref: "../../components/parameters/asset-list-limit.yaml"
    - $ref: "../../components/parameters/asset-list-after.yaml"
  responses:
    "200":
      $ref: "../../components/responses/listAssets-200.yaml"
    "400":
      $ref: "../../components/responses/InvalidRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthenticated.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
