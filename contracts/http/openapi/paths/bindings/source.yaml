get:
  operationId: "listSourceSignalBindings"
  summary: "Read a bounded signal-binding snapshot for one source signal"
  description: "The latest revision known at known_at_ms is selected, then tested at effective_at_ms. Results are bounded pages ordered by stable ID. A cursor traversal is not a cross-request database snapshot; repeat the same times and limit on the next page. The exact device asset, endpoint, and signal tuple selects a source; an unregistered signal can validly return an empty page."
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/metadata-read-tenant-id.yaml"
    - $ref: "../../components/parameters/device-asset-id.yaml"
    - $ref: "../../components/parameters/endpoint-id.yaml"
    - $ref: "../../components/parameters/signal-id.yaml"
    - $ref: "../../components/parameters/effective-at-ms.yaml"
    - $ref: "../../components/parameters/known-at-ms.yaml"
    - $ref: "../../components/parameters/snapshot-limit.yaml"
    - $ref: "../../components/parameters/binding-after.yaml"
  responses:
    "200":
      $ref: "../../components/responses/listSourceSignalBindings-200.yaml"
    "400":
      $ref: "../../components/responses/InvalidRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthenticated.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
