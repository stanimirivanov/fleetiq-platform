get:
  operationId: listPropertyHistory
  summary: List bounded property history
  description: 'Requires exact telemetry.read. Returns all interpretations for one pinned property in
    a half-open event-time window of at most seven days. Ascending event time then full interpretation
    key provides stable ties, not latest-state precedence. Pages are not a snapshot: restart the window
    to observe late appends behind the cursor. No raw payload, transparent object-store scan, correction collapse or
    implicit unit conversion. Configured lifecycle budgets reserve one slot and 1048576 response bytes; denied admission or oversized output returns 429. Disabled policies preserve prior hot-only behavior. The opt-in hot_and_restored mode always has a five-second/1 MiB bound and merges one selected restore generation, deduplicated by immutable identity. Its coverage is selected_manifest_only, never interval completeness. Cursors additionally bind mode, manifest, restore generation and coverage state; expiry or state changes require restarting and return 400 for old cursors. Unavailable selections issue no continuation; select a valid restore generation or use hot mode to continue hot-only paging.'
  security:
  - bearerAuth: []
  - cookieAuth: []
  parameters:
  - $ref: ../../components/parameters/telemetry-tenant-id.yaml
  - $ref: ../../components/parameters/history-asset-id.yaml
  - $ref: ../../components/parameters/property-id.yaml
  - $ref: ../../components/parameters/definition-version.yaml
  - $ref: ../../components/parameters/history-start-at-ms.yaml
  - $ref: ../../components/parameters/history-end-at-ms.yaml
  - $ref: ../../components/parameters/history-limit.yaml
  - $ref: ../../components/parameters/history-after.yaml
  - $ref: ../../components/parameters/history-mode.yaml
  - $ref: ../../components/parameters/history-manifest-id.yaml
  - $ref: ../../components/parameters/history-restore-generation.yaml
  responses:
    '429':
      $ref: ../../components/responses/HistoryBudgetExceeded.yaml
    '200':
      $ref: ../../components/responses/PropertyHistorySucceeded.yaml
    '400':
      $ref: ../../components/responses/InvalidRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
