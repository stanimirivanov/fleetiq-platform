[package]
name = "fleetiq-protocol-wasm"
version = "0.1.0"
description = "Wasmtime compute and memory enforcement experiment for FleetIQ protocol packages"
edition.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetiq-domain = { path = "../domain" }
fleetiq-protocol-host = { path = "../protocol-host" }
fleetiq-protocol-sdk = { path = "../protocol-sdk" }
fleetiq-telemetry = { path = "../telemetry" }
sha2.workspace = true
wasmtime.workspace = true

[dev-dependencies]
# Fixture encoding must track the parser/encoder generation used by WIT tooling.
wat = "=1.259.0"
wit-component = { version = "0.254.0", default-features = false, features = ["dummy-module"] }
wit-parser = { version = "0.254.0", default-features = false }

[lints]
workspace = true
