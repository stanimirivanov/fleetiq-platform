[package]
name = "fleetiq-protocol-wasm"
version = "0.1.0"
description = "Wasmtime compute and memory enforcement experiment for FleetIQ protocol packages"
edition.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
fleetiq-domain = { path = "../domain" }
fleetiq-protocol-host = { path = "../protocol-host" }
fleetiq-protocol-sdk = { path = "../protocol-sdk" }
fleetiq-telemetry = { path = "../telemetry" }
sha2.workspace = true
wasmtime.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rlimit.workspace = true

[[bin]]
name = "fleetiq-protocol-admission"
path = "src/bin/admission.rs"


[[bin]]
name = "fleetiq-protocol-decode"
path = "src/bin/decode.rs"

[dev-dependencies]
# Fixture parser and encoder must use the same wasm-tools release.
wat = "=1.262.0"
wit-component = { version = "=0.262.0", default-features = false, features = ["dummy-module"] }
wit-parser = { version = "=0.262.0", default-features = false, features = ["std"] }

[lints]
workspace = true
