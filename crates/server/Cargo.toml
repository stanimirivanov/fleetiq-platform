[package]
name = "fleetiq-server"
version = "0.1.0"
description = "FleetIQ backend composition root and protected HTTP metadata queries"
edition.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
cookie.workspace = true
getrandom.workspace = true
openidconnect.workspace = true
sha2.workspace = true
url.workspace = true
fleetiq-access = { path = "../access" }
fleetiq-protocol-sdk = { path = "../protocol-sdk" }
fleetiq-history = { path = "../history" }
fleetiq-ingestion = { path = "../ingestion" }
fleetiq-telemetry = { path = "../telemetry" }
fleetiq-domain = { path = "../domain" }
fleetiq-identity = { path = "../identity" }
fleetiq-metadata = { path = "../metadata" }
fleetiq-postgres = { path = "../postgres" }
serde_json.workspace = true
serde.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync"] }

[dev-dependencies]
jsonschema = { version = "0.60.0", default-features = false }
tower.workspace = true
# Real TLS fixtures generate ephemeral keys; neither dependency enters runtime.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { workspace = true, features = ["io-util", "sync", "test-util"] }

[lints]
workspace = true
